version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: swayam_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swayam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d swayam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swayam_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swayam_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://user:password@db:5432/swayam?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      JWT_SECRET: super_secret_key_change_in_production
      JWT_REFRESH_SECRET: super_secret_refresh_key_change_in_production
      CORS_ORIGIN: "http://localhost"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/v1/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-frontend:
    build:
      context: ./frontend/user
      dockerfile: Dockerfile
    container_name: swayam_user_frontend
    environment:
      VITE_API_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

  admin-frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: swayam_admin_frontend
    environment:
      VITE_API_URL: /api/v1
    ports:
      - "8081:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: swayam_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - user-frontend
      - admin-frontend

volumes:
  pgdata:
  redisdata:
  uploads_data:
