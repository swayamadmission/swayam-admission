services:
  - type: web
    name: swayam-admission-backend
    runtime: node
    rootDir: backend
    plan: starter # Starter or Free tier
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: LOCAL
      - key: GOOGLE_CLIENT_ID
        sync: false
